name: Update runtime

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7
        with:
          perl-version: "5.40"
          install-modules: App::cpanminus

      - run: ./scripts/update-runtime
      - run: make integration

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Runtime is already current."
            exit 0
          fi
          branch="automation/update-runtime-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime
          git commit -m "Update bundled runtime"
          git push origin "$branch"
          gh pr create \
            --draft \
            --title "Update bundled runtime" \
            --body "Automated rebuild of the bundled cpm and Carton runtime." \
            --base main \
            --head "$branch"
