name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minilla version (vX.Y.Z or X.Y.Z)
        required: true
        default: v3.2.0

concurrency:
  group: update-snapshots-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate and verify snapshot
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rm -rf -- "snapshots/v$VERSION"

          ./scripts/update-snapshots "$INPUT_VERSION"
          make integration

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-${{ runner.os }}-${{ runner.arch }}
          path: snapshots
          if-no-files-found: error

  create-pull-request:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare to replace the selected release snapshots
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rm -rf -- "snapshots/v$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: snapshot-*
          path: snapshots
          merge-multiple: true

      - name: Create Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/check-snapshots
          git add snapshots

          if git diff --cached --quiet -- snapshots; then
            echo "Snapshots are already current."
            exit 0
          fi

          branch="automation/update-snapshots-${VERSION#v}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Minilla $VERSION snapshots"
          git push origin "$branch"

          gh pr create --draft --title "Update Minilla $VERSION snapshots" \
            --body "Generated on GitHub-hosted Ubuntu and macOS runners using each image's system Perl." \
            --base "${{ github.event.repository.default_branch }}" --head "$branch"
