name: Update snapshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minilla version (vX.Y.Z or X.Y.Z)
        type: string
        required: true
        default: v3.2.0

concurrency:
  group: update-snapshots-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Generate and verify snapshot
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rm -rf -- "snapshots/v$VERSION"

          ./scripts/update-snapshots "$INPUT_VERSION"
          make integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ runner.os }}-${{ runner.arch }}
          path: snapshots
          if-no-files-found: error

  create-pull-request:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Prepare to replace the selected release snapshots
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rm -rf -- "snapshots/v$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: snapshot-*
          path: snapshots
          merge-multiple: true

      - name: Create Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ./scripts/check-snapshots
          git add snapshots

          if git diff --cached --quiet -- snapshots; then
            echo "Snapshots are already current."
            exit 0
          fi

          branch="automation/update-snapshots-${VERSION#v}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Minilla $VERSION snapshots"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "$branch"

          gh pr create --draft --title "Update Minilla $VERSION snapshots" \
            --body "Generated on GitHub-hosted Ubuntu and macOS runners using each image's system Perl." \
            --base "${{ github.event.repository.default_branch }}" --head "$branch"
