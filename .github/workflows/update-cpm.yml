name: Update bundled cpm

on:
  pull_request:
    types:
      - labeled
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dependency:cpm') &&
      (github.event.action != 'labeled' || github.event.label.name == 'dependency:cpm') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Refresh the bundled executable and checksums
        run: |
          ./scripts/update-runtime
          make check

      - name: Commit generated runtime files
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add runtime/cpm runtime/manifest.json

          if git diff --cached --quiet; then
            echo "Bundled cpm files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate bundled cpm"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:$HEAD_REF"

          gh workflow run ci.yml --ref "$HEAD_REF"
