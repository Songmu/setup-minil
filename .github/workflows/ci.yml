name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        resolution:
          - dynamic
          - snapshot
          - committed-snapshot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline regression tests
        if: matrix.resolution == 'dynamic'
        run: make test

      - name: Select Perl for dynamic resolution
        if: matrix.resolution == 'dynamic'
        uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7 # v1.44.2
        with:
          perl-version: "5.40"

      - name: Generate an exact dependency snapshot
        if: matrix.resolution == 'snapshot'
        run: ./scripts/update-snapshots v3.2.0

      - name: Verify the committed snapshot matches the selected Perl
        if: matrix.resolution == 'committed-snapshot'
        shell: bash
        run: |
          perl -I scripts -MSetupMinil -e '
            my $env = environment("v3.2.0");
            check_snapshot("./snapshots/" . snapshot_path($env), $env);
          '

      - name: Record caller Perl environment
        id: perl-env
        shell: bash
        run: echo "perl5lib=${PERL5LIB-}" >>"$GITHUB_OUTPUT"
      - id: setup
        uses: ./

      - name: Exercise the composite action
        shell: bash
        env:
          EXPECTED_PERL5LIB: ${{ steps.perl-env.outputs.perl5lib }}
          EXPECTED_RESOLUTION_MODE: ${{ matrix.resolution == 'dynamic' && 'dynamic' || 'snapshot' }}
        run: |
          test '${{ steps.setup.outputs.version }}' = 'v3.2.0'
          test "${PERL5LIB-}" = "$EXPECTED_PERL5LIB"
          SETUP_MINIL_BIN="$(dirname "$(command -v minil)")" ./t/smoke.sh

          GITHUB_OUTPUT="$RUNNER_TEMP/setup-minil-output" ./scripts/setup-minil
          grep -qx "resolution-mode=$EXPECTED_RESOLUTION_MODE" "$RUNNER_TEMP/setup-minil-output"

      - name: Verify committed snapshots were not modified
        if: matrix.resolution == 'committed-snapshot'
        run: git diff --exit-code -- snapshots
