name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        resolution: [dynamic, snapshot]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - if: matrix.resolution == 'dynamic'
        run: make test
      - if: matrix.resolution == 'dynamic'
        uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7
        with:
          perl-version: "5.40"
      - if: matrix.resolution == 'snapshot'
        run: ./scripts/update-snapshots v3.2.0
      - id: perl-env
        shell: bash
        run: echo "perl5lib=${PERL5LIB-}" >>"$GITHUB_OUTPUT"
      - id: setup
        uses: ./
      - name: Exercise the composite action
        shell: bash
        env:
          EXPECTED_PERL5LIB: ${{ steps.perl-env.outputs.perl5lib }}
        run: |
          test '${{ steps.setup.outputs.version }}' = 'v3.2.0'
          test "${PERL5LIB-}" = "$EXPECTED_PERL5LIB"
          SETUP_MINIL_BIN="$(dirname "$(command -v minil)")" ./test/smoke.sh
          GITHUB_OUTPUT="$RUNNER_TEMP/setup-minil-output" ./scripts/setup-minil
          grep -qx 'resolution-mode=${{ matrix.resolution }}' "$RUNNER_TEMP/setup-minil-output"
