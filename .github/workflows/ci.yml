name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: make test

  dynamic-install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: shogo82148/actions-setup-perl@8b574cdc2dffdae49f803204a4f2b716a2fa1db7
        with:
          perl-version: "5.40"

      - name: Record caller Perl environment
        id: perl-env
        shell: bash
        run: echo "perl5lib=${PERL5LIB-}" >>"$GITHUB_OUTPUT"

      - id: setup
        uses: ./

      - name: Verify installation
        shell: bash
        env:
          EXPECTED_PERL5LIB: ${{ steps.perl-env.outputs.perl5lib }}
        run: |
          set -euo pipefail
          test '${{ steps.setup.outputs.version }}' = 'v3.2.0'
          minil --version | grep -F 'v3.2.0'
          test "${PERL5LIB-}" = "$EXPECTED_PERL5LIB"

      - name: Exercise Minilla
        shell: bash
        run: |
          set -euo pipefail
          cp -R test/fixtures/minimal-dist "$RUNNER_TEMP/minimal-dist"
          cd "$RUNNER_TEMP/minimal-dist"
          git init --quiet
          git config user.name "setup-minil CI"
          git config user.email "setup-minil@example.invalid"
          git add .
          minil test

  snapshot-install:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/update-snapshots v3.2.0
      - run: SETUP_MINIL_INTEGRATION=true SETUP_MINIL_OUTPUT="$RUNNER_TEMP/setup-minil-output" ./test/smoke.sh
      - name: Verify snapshot resolution
        shell: bash
        run: grep -q '^resolution-mode=snapshot$' "$RUNNER_TEMP/setup-minil-output"

  rejected-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject an unsupported version
        id: unsupported
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0
      - name: Check rejection
        shell: bash
        run: test '${{ steps.unsupported.outcome }}' = 'failure'
