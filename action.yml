name: Setup Minilla
description: Install an allowlisted Minilla release with the Perl currently selected on the runner
author: Masayuki Matsuki

branding:
  icon: package
  color: blue

inputs:
  version:
    description: Exact supported Minilla CPAN release
    default: v3.2.0

outputs:
  version:
    description: Installed Minilla version
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: '"${GITHUB_ACTION_PATH}/scripts/setup-minil"'
